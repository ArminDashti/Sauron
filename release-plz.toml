[workspace]
release = false
pr_name = "chore(GDK): release{% if version %} v{{ version }}{% endif %}"
git_tag_enable = false
git_tag_name = "gdk-v{{ version }}"
git_release_enable = false

[[package]]
name = "sauron-provider-types"
release = true
version_group = "gdk"

[[package]]
name = "sauron-sdk-types"
release = true
version_group = "gdk"

[[package]]
name = "sauron-download-manager"
release = true
version_group = "gdk"

[[package]]
name = "sauron-providers"
release = true
version_group = "gdk"
# --all-features turns on the cuda/vulkan/mlx local-inference accelerators,
# which need a CUDA/Vulkan/Metal toolchain the release runner doesn't have.
semver_check = false

[[package]]
name = "sauron-agent"
release = true
version_group = "gdk"

[[package]]
name = "sauron-context-management"
release = true
version_group = "gdk"

[[package]]
name = "sauron-sdk"
release = true
version_group = "gdk"
