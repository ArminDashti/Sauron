[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sauron-sdk"
version = "0.1.0a11"
description = "Python bindings for the sauron Development Kit (GDK)"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
authors = [{ name = "AAIF", email = "ai-oss-tools@block.xyz" }]
keywords = ["sauron", "gdk", "sdk", "ai", "agent", "uniffi"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Rust",
]

[project.urls]
Homepage = "https://github.com/ArminDashti/Sauron"
Repository = "https://github.com/ArminDashti/Sauron"
Issues = "https://github.com/ArminDashti/Sauron/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sauron = ["*.so", "*.dylib", "*.dll", "py.typed"]
