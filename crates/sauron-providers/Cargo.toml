[package]
name = "sauron-providers"
version = "0.1.0-alpha.11"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description.workspace = true

[lints]
workspace = true

[features]
default = []
# On-device inference. llama.cpp and its sys crate build native code, so the
# whole set stays optional: a default `cargo build -p sauron-providers` must not
# need a C/C++ toolchain.
local-inference = [
    "dep:llama-cpp-2",
    "dep:llama-cpp-sys-2",
    "dep:encoding_rs",
    "dep:etcetera",
    "dep:minijinja",
    "dep:pulldown-cmark",
    "dep:regex",
]
local-inference-hf-hub = [
    "local-inference",
    "dep:hf-hub",
    "dep:sauron-download-manager",
    "dep:sauron-sdk-types",
]
cuda = ["local-inference", "llama-cpp-2/cuda"]
vulkan = ["local-inference", "llama-cpp-2/vulkan"]
mlx = ["local-inference", "dep:safemlx", "dep:safemlx-lm", "dep:safemlx-lm-utils"]
rustls-tls = [
    "reqwest/rustls",
    "rmcp/reqwest",
    "tokio-tungstenite?/rustls-tls-webpki-roots",
]
live-websocket = ["dep:tokio-tungstenite", "dep:http"]
native-tls = [
    "dep:pem",
    "dep:pkcs8",
    "dep:sec1",
    "reqwest/native-tls",
    "rmcp/reqwest-native-tls",
    "tokio-tungstenite?/native-tls",
]

[dependencies]
anyhow = { workspace = true }
async-stream = { workspace = true }
chrono = { workspace = true }
futures = { workspace = true }
sauron-provider-types = { version = "0.1.0-alpha.11", path = "../sauron-provider-types", default-features = false }
reqwest = { workspace = true, features = ["json", "stream"] }
rmcp = { workspace = true, features = ["server", "macros"] }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true, features = ["fs", "rt-multi-thread", "sync", "time"] }
tokio-stream = { workspace = true, features = ["io-util"] }
tokio-util = { workspace = true, features = ["compat", "io", "codec"] }
url = { workspace = true }
urlencoding = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
base64 = { workspace = true }
include_dir = { workspace = true }

# On-device inference, behind the `local-inference` feature.
llama-cpp-2 = { workspace = true, optional = true }
llama-cpp-sys-2 = { workspace = true, optional = true }
encoding_rs = { version = "0.8.35", default-features = false, optional = true }
etcetera = { workspace = true, optional = true }
minijinja = { version = "2.18", default-features = false, features = ["loader", "multi_template", "serde"], optional = true }
pulldown-cmark = { version = "0.13.4", default-features = false, optional = true }
regex = { workspace = true, optional = true }
sauron-download-manager = { version = "0.1.0-alpha.11", path = "../sauron-download-manager", optional = true }
sauron-sdk-types = { version = "0.1.0-alpha.11", path = "../sauron-sdk-types", default-features = false, optional = true }
hf-hub = { version = "1.0.0", default-features = false, optional = true }

tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "handshake"], optional = true }
http = { workspace = true, optional = true }
pem = { version = "4.0.0", default-features = false, features = ["std"], optional = true }
pkcs8 = { version = "0.11", default-features = false, features = ["alloc", "std"], optional = true }
sec1 = { version = "0.8", default-features = false, features = ["der", "std"], optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
llama-cpp-2 = { workspace = true, features = ["sampler", "metal", "mtmd"], optional = true }
safemlx = { default-features = false, features = ["accelerate", "metal", "safetensors"], optional = true, version = "0.1.2" }
safemlx-lm = { optional = true, version = "0.4.1" }
safemlx-lm-utils = { optional = true, version = "0.1.2" }

[dev-dependencies]
test-case = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "test-util", "time"] }
tokio-stream = { workspace = true }
env-lock = { workspace = true }
wiremock.workspace = true
flate2 = "1.1.9"
reqwest = { workspace = true, features = ["gzip"] }

[[example]]
name = "streaming"
required-features = ["rustls-tls"]

[[example]]
name = "openai_live"
required-features = ["live-websocket", "rustls-tls"]
